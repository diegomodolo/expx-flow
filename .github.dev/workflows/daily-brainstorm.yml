name: Daily Feature Brainstorm

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  brainstorm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Generate suggestion
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Categoria por dia da semana
          DAY_OF_WEEK=$(date +%u)
          case $DAY_OF_WEEK in
            1|4) CATEGORY="Competitiva" ;;
            2|5) CATEGORY="Automacao" ;;
            3|6) CATEGORY="IA e Agentes" ;;
            7)   CATEGORY="Integracao" ;;
          esac

          claude -p "
          Voce e um product manager especialista em plataformas de marketing digital.

          ## Contexto
          Leia CLAUDE.md para entender o Expx Flow — plataforma de automacao de marketing e gestao de trafego.
          Areas: campanhas multi-plataforma (Facebook, Google, Instagram), CRM, WhatsApp, agentes IA, dashboards, relatorios, CS.

          ## Tarefa
          Sugira UMA feature para a categoria: $CATEGORY

          Categorias adaptadas ao Expx Flow:
          - Competitiva: features que concorrentes (mLabs, RD Station, HubSpot) tem e o Expx Flow nao
          - Automacao: automacoes de marketing, workflows, triggers, agendamento
          - IA e Agentes: novos agentes IA, analise automatica, geracao de conteudo, insights
          - Integracao: novas plataformas, APIs, webhooks, sincronizacao

          ## Regras
          1. Verificar issues existentes para evitar duplicatas:
             gh issue list --label feature-suggestion --state all --limit 50 --json title --jq '.[].title'
          2. Implementavel na stack atual (React + Supabase + Edge Functions)
          3. Valor real para gestores de trafego e agencias de marketing
          4. Implementavel em 1-2 dias

          ## Output
          1. Criar issue com:
             gh issue create --label feature-suggestion --title 'TITULO' --body 'CORPO'
             Corpo deve incluir: problema, proposta, impacto estimado, complexidade
          2. Enviar notificacao Telegram:
             curl -s -X POST \"https://api.telegram.org/bot\${TELEGRAM_BOT_TOKEN}/sendMessage\" \\
               -d chat_id=\"\${TELEGRAM_CHAT_ID}\" \\
               -d parse_mode=\"Markdown\" \\
               -d disable_web_page_preview=\"true\" \\
               -d text=\"MENSAGEM\"
          " --max-turns 30 --allowedTools Bash,Read,Glob,Grep
