name: Jules Test Coverage

on:
  issues:
    types: [labeled]
  schedule:
    - cron: "0 4 * * 3" # Quarta 04:00 UTC
  workflow_dispatch:
    inputs:
      target:
        description: "Arquivo ou modulo alvo"
        required: true
        type: string

jobs:
  tests:
    if: |
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issues' && github.event.label.name == 'jules' && contains(github.event.issue.labels.*.name, 'tests'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check user allowlist
        if: github.event_name == 'issues'
        run: |
          ALLOWED='["bittencourtthulio"]'
          USER="${{ github.event.issue.user.login }}"
          if ! echo "$ALLOWED" | jq -e "index(\"$USER\")" > /dev/null; then
            echo "::error::Usuario $USER nao autorizado para trigger Jules"
            exit 1
          fi

      - uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            Voce e um engenheiro de qualidade.

            ## Contexto
            Leia AGENTS.md na raiz para entender o projeto e convencoes de teste.

            ## Tarefa
            Identifique arquivos sem cobertura de teste e crie testes.

            ## Convencoes
            - React 18 + TypeScript + Vite
            - Componentes UI usam shadcn/ui + Radix UI + Tailwind CSS
            - Data fetching via hooks com React Query (useQuery/useMutation)
            - Formularios com React Hook Form + Zod
            - UI em portugues (pt-BR)
            - Path alias: @/ → ./src/
            - Minimo: teste de renderizacao + teste de comportamento
            - Cubra casos de sucesso E erro
            - Nomes de teste em portugues

            ## Regras
            - Todos os testes devem passar
            - Nao altere codigo fonte (apenas crie testes)
            - Rode: npm run build
            - Crie PR com lista de testes adicionados
            - Atualize .Jules/performance.md se encontrar problemas de performance durante testes

      - name: Notificar Telegram
        if: always()
        run: |
          STATUS="${{ job.status == 'success' && '✅ Concluido' || '❌ Falhou' }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="🧪 *Jules Tests — ${STATUS}*

          [Ver execucao](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
